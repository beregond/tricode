[package]
name = "tricode-core"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Encode text into triangle-grid codes and read them back from images"
repository = "https://github.com/beregond/tricode"
readme = "README.md"
keywords = ["barcode", "triangle", "reed-solomon", "encoding", "image"]
categories = ["encoding", "multimedia::images"]
# Decode fixtures (2 MB) are only for the repository's tests.
exclude = ["testdata/"]

# Log with `tracing` macros instead; the hub forwards events to Dart.
[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "rayon"] }
imageproc = "0.27.0"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
crc32fast = "1.5"
tracing = "0.1.44"
# `std::time::SystemTime` on native; backed by `Date.now()` on the web, where std panics.
web-time = "1.1"

[dev-dependencies]
rand = "0.10.3"
rand_chacha = "0.10.0"
# `use test_log::test;` in the test module gives every #[test] a subscriber: RUST_LOG=tricode_core=trace.
test-log = { version = "0.2.21", default-features = false, features = ["trace"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
