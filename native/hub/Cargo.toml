[package]
# Do not change the name of this crate.
name = "hub"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
# `lib` is required for non-library targets,
# such as tests and benchmarks.
# `cdylib` is for Linux, Android, Windows, and web.
# `staticlib` is for iOS and macOS.
crate-type = ["lib", "cdylib", "staticlib"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
# Log with `tracing` instead (see src/logging.rs): stdout and stderr go nowhere on mobile and web.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[dependencies]
rinf = "8.11.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
async-trait = "0.1.92"
messages = "0.3.1"
tokio_with_wasm = { version = "0.9.2", features = ["rt", "macros", "time"] }
wasm-bindgen = "0.2.130"
tricode = { version = "0.1.0", path = "../tricode" }
# Release app builds keep info and above: debug and trace calls compile out, tricode's too.
# Set here, not in tricode, so `tricode-test` (a release build of tricode alone) keeps them.
tracing = { version = "0.1.44", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
