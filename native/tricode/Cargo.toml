[package]
name = "tricode"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Command-line tool that writes triangle-grid codes as PNGs and reads them back from images"
repository = "https://github.com/beregond/tricode"
readme = "README.md"
keywords = ["barcode", "triangle", "reed-solomon", "cli", "image"]
categories = ["command-line-utilities", "multimedia::images"]

# The command is `tricode`; the Flutter app's binary is `tricode-gui`, so both install side by side.

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tricode-core = { version = "1.0.0", path = "../tricode-core" }
