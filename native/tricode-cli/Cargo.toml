[package]
name = "tricode-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Command-line tool that writes triangle-grid codes as PNGs and reads them back from images"
repository = "https://github.com/beregond/tricode"
readme = "README.md"
keywords = ["barcode", "triangle", "reed-solomon", "cli", "image"]
categories = ["command-line-utilities", "multimedia::images"]

# The command is `tricode`; the Flutter app's binary is `tricode-gui`, so both install side by side.
[[bin]]
name = "tricode"
path = "src/main.rs"
# Its docs would collide with the `tricode` library's in target/doc/tricode.
doc = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tricode = { version = "0.1.0", path = "../tricode" }
