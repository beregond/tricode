name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pinned so new lints in a fresh stable release don't break CI unannounced; bump deliberately.
  RUST_TOOLCHAIN: "1.97.1"
  FLUTTER_VERSION: "3.47.2"
  # Must match `rinf` in native/hub/Cargo.toml and pubspec.yaml.
  RINF_VERSION: "8.11.0"
  CARGO_ABOUT_VERSION: "0.9.3"

jobs:
  rust-lint:
    name: Rust lint (rustfmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: devbin/tricode-test --locked
      # Old fixtures can still decode after a rendering change, so the tests above don't catch
      # a forgotten regeneration.
      - name: Check decode fixtures are up to date
        run: |
          devbin/tricode-regen-fixtures --locked
          if [ -n "$(git status --porcelain -- native/tricode-core/testdata/decode)" ]; then
            git status --short -- native/tricode-core/testdata/decode
            echo "::error::Decode fixtures are stale. Run devbin/tricode-regen-fixtures and commit the result."
            exit 1
          fi

  licenses:
    name: Rust licences up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-about --version "$CARGO_ABOUT_VERSION" --locked --features cli
      - name: Check the licence list is up to date
        run: |
          devbin/tricode-regen-licenses
          if [ -n "$(git status --porcelain -- assets/licenses)" ]; then
            git status --short -- assets/licenses
            echo "::error::Rust licence list is stale. Run devbin/tricode-regen-licenses and commit the result."
            exit 1
          fi

  flutter:
    name: Flutter (format, analyze, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: flutter pub get --enforce-lockfile
      # lib/src/bindings/ is gitignored, and the Dart code doesn't compile without it.
      - run: cargo install rinf_cli --version "$RINF_VERSION" --locked
      - run: rinf gen
      # Tracked files only: the generated bindings aren't dart-formatted.
      - run: git ls-files -z '*.dart' | xargs -0 dart format --output=none --set-exit-if-changed
      - run: flutter analyze
      - run: flutter test

  shellcheck:
    name: ShellCheck (devbin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck devbin/*

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
